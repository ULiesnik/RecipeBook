# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/app/Web/Web.csproj; dotnet restore ./src/test/RecipeBookTest.csproj

      - name: Lint with dotnet format
        run: dotnet format ./src/app/Web/Web.csproj --verify-no-changes --severity warn; dotnet format ./src/app/Data/Data.csproj --verify-no-changes --severity warn; dotnet format ./src/app/Business/Business.csproj --verify-no-changes --severity warn

      - name: Build
        run: dotnet build ./src/app/Web/Web.csproj --no-restore --configuration Release; dotnet build ./src/test/RecipeBookTest.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ./src/test/RecipeBookTest.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

      - name: Generate coverage report
        shell: powershell
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          & dotnet-reportgenerator-globaltool -reports:TestResults/**/coverage.cobertura.xml -targetdir:coveragereport -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coveragereport

      - name: Generate Build Report
        run: echo "Build and tests succeeded for ${{ github.repository }} on ${{ github.ref_name }}"
